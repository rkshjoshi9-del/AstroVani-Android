
name: Build AstroVani Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip AstroVani_Android_Source.zip -d extracted
      - name: Build APK
        working-directory: extracted/AstroVani_Android
        run: |
          cat > /tmp/jvm17.init.gradle <<'EOF'
          allprojects {
            tasks.withType(JavaCompile).configureEach {
              sourceCompatibility = '17'
              targetCompatibility = '17'
            }
            afterEvaluate {
              tasks.matching { it.name == 'compileDebugKotlin' }.configureEach {
                kotlinOptions.jvmTarget = '17'
              }
            }
          }
          EOF
          gradle -I /tmp/jvm17.init.gradle assembleDebug
          name: AstroVani-debug-apk
          path: extracted/AstroVani_Android/app/build/outputs/apk/debug/app-debug.apk
          
